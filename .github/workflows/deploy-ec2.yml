name: Deploy to EC2

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: hubcomercio-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate project
        run: bun run check

      - name: Build production app
        run: bun run build

      - name: Package build
        run: tar -czf /tmp/hubcomercio.tar.gz build

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i ~/.ssh/ec2_key /tmp/hubcomercio.tar.gz "$SSH_USER@$SSH_HOST:/tmp/hubcomercio.tar.gz"

      - name: Deploy and restart service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$SSH_USER@$SSH_HOST" <<'REMOTE'
            set -euo pipefail

            APP_DIR=/var/www/commerce-front
            ARCHIVE=/tmp/hubcomercio.tar.gz

            test "$APP_DIR" = "/var/www/commerce-front"
            test -d "$APP_DIR"

            rm -rf "$APP_DIR/build"
            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            rm -f "$ARCHIVE"
            test -f "$APP_DIR/build/index.js"

            sudo -n systemctl restart hubcomercio.service
            sudo -n systemctl is-active --quiet hubcomercio.service
          REMOTE
